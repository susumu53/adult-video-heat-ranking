name: Scheduled Data Fetcher (Livedoor Blog Backend)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Fetch Latest Video Heat Data
        run: npm run fetch-data

      - name: Commit Updated Data & History to Main Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rankings.json public/data/rankings.json data/history/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(data): update video heat rankings and daily history [skip ci]"
          git push origin main
